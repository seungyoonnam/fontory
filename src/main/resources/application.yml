server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/db25123
    username: root
    password: dbpass251
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
